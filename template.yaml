AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Email SQS queue and lambda

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  # The address itself lives in SSM Parameter Store; this parameter carries its PATH, and
  # CloudFormation resolves the value at deploy time. Type String, not SecureString: CloudFormation
  # SSM parameter types accept only String and StringList, and {{resolve:ssm-secure:...}} is
  # restricted to an allowlist of properties that does not include an SNS Subscription Endpoint.
  # No NoEcho: it has no effect on SSM parameter types, which surface the resolved value in stack
  # events. The path cannot come from Mappings -- Parameters resolve before Mappings are available,
  # so !FindInMap is unusable in a Default. Prod is the default; test and feature deploys override it.
  AlertEmailAddressPath:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /emails-queue-service/alert-email-address
    Description: SSM Parameter Store path holding the address that receives dead-letter queue alarm notifications
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      bucket: emails-service-storage
      domain: dbowland.com
      logStreamFunction: log-subscriber
      project: emails-queue-service
      queueNameBounce: emails-to-bounce
      queueNameSend: emails-to-send
    test:
      bucket: emails-service-storage-test
      domain: bowland.link
      logStreamFunction: log-subscriber-test
      project: emails-queue-service-test
      queueNameBounce: emails-to-bounce-test
      queueNameSend: emails-to-send-test

Resources:
  # Emails to Send

  EmailsToSendQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days
      QueueName: !Sub
        - '${Name}.fifo'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueNameSend]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmailsToSendDeadLetterQueue.Arn
        maxReceiveCount: 3
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
      VisibilityTimeout: 360 # 6x the processor's Timeout, per AWS guidance, to avoid redelivery mid-invocation

  # A FIFO queue can only dead-letter to another FIFO queue
  EmailsToSendDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days
      QueueName: !Sub
        - '${Name}-dlq.fifo'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueNameSend]
      # Long polling matters here only for the operator: nothing consumes this
      # queue, and short polling can report it empty when it is not.
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  EmailsToSendProcessor:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      Description: Processes queued messages to send emails
      Environment:
        Variables:
          EMAIL_BUCKET: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
          EMAIL_REGION: us-east-1
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            # BatchSize 1, matching the bounce queue. Every message shares one MessageGroupId, so the
            # queue is already serialized to concurrency 1 and a larger batch buys no throughput --
            # but it does widen the blast radius. Fail-forward correctly returns the failing record
            # and everything behind it, and SQS increments ReceiveCount on redelivery even for
            # records the loop never attempted, so at maxReceiveCount 3 one poison message would
            # dead-letter up to six untried emails with it. Their senders already got a 201.
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            Queue: !GetAtt EmailsToSendQueue.Arn
      Handler: src/handlers/emails-to-send-processor.emailsToSendProcessorHandler
      MemorySize: 1536
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Grant access to S3 bucket
        - S3CrudPolicy:
            BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Grant access to SES identity
        - SESCrudPolicy:
            IdentityName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        # Grant access to SQS queue
        - SQSPollerPolicy:
            QueueName: !GetAtt EmailsToSendQueue.QueueName
      Runtime: nodejs24.x
      Tags:
        'created-by': 'emails-queue-service'
        'created-for': 'emails'
        'environment': !Ref Environment
      Timeout: 60
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/emails-to-send-processor.ts

  EmailsToSendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EmailsToSendProcessor}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  # EmailsToSendLogGroup is deliberately not subscribed to log-subscriber. log-subscriber sends its
  # alerts by email, which is the pipeline this log group belongs to, so a subscription here would
  # make every failed send log an ERROR that enqueues another email, which fails the same way. The
  # send path is therefore not alerted through the logs at all; failures land in
  # EmailsToSendDeadLetterQueue and raise EmailsToSendDeadLetterQueueAlarm over SNS instead. The
  # bounce path below is not on log-subscriber's send path and stays subscribed.

  # Emails to Bounce

  EmailsToBounceQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days
      QueueName: !Sub
        - '${Name}.fifo'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueNameBounce]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmailsToBounceDeadLetterQueue.Arn
        maxReceiveCount: 3
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
      VisibilityTimeout: 360 # 6x the processor's Timeout, per AWS guidance, to avoid redelivery mid-invocation

  # A FIFO queue can only dead-letter to another FIFO queue
  EmailsToBounceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days
      QueueName: !Sub
        - '${Name}-dlq.fifo'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueNameBounce]
      # Long polling matters here only for the operator: nothing consumes this
      # queue, and short polling can report it empty when it is not.
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  EmailsToBounceProcessor:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      Description: Processes queued messages to bounce emails
      Environment:
        Variables:
          EMAIL_BUCKET: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
          EMAIL_REGION: us-east-1
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            Queue: !GetAtt EmailsToBounceQueue.Arn
      Handler: src/handlers/emails-to-bounce-processor.emailsToBounceProcessorHandler
      MemorySize: 1024
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Grant access to S3 bucket
        - S3CrudPolicy:
            BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Grant access to SQS queue
        - SQSPollerPolicy:
            QueueName: !GetAtt EmailsToBounceQueue.QueueName
        # Grant access to send bounces
        - SESSendBouncePolicy:
            IdentityName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
      Runtime: nodejs24.x
      Tags:
        'created-by': 'emails-queue-service'
        'created-for': 'emails'
        'environment': !Ref Environment
      Timeout: 60
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/emails-to-bounce-processor.ts

  EmailsToBounceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EmailsToBounceProcessor}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  EmailsToBounceLogGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref EmailsToBounceLogGroup

  # Dead-letter queue alarms

  # SNS delivers this mail itself and never enters emails-queue-api, so alerting about a broken
  # email pipeline does not depend on that pipeline. The topic is deliberately unencrypted: a
  # CloudWatch alarm cannot publish to a topic encrypted with the AWS-managed alias/aws/sns key,
  # and the notification carries only a queue name and a message count, never message content.
  DeadLetterQueueAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        # !Ref on an SSM parameter type yields the resolved value, not the path
        - Endpoint: !Ref AlertEmailAddressPath
          Protocol: email
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
      TopicName: !Sub
        - '${Project}-dead-letter-queue-alarms'
        - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]

  # Maximum, not Sum or Average: ApproximateNumberOfMessagesVisible is a gauge, so summing the
  # datapoints in a period counts the same backlog repeatedly and averaging hides a message that
  # arrives late in the period. One datapoint over a 5-minute period is enough to fire, because
  # anything reaching a DLQ has already failed maxReceiveCount times and needs no further
  # confirmation. TreatMissingData is ignore rather than notBreaching: SQS stops publishing metrics
  # for an idle queue, and nothing polls these queues, so a DLQ holding one message can go quiet
  # while still holding it. notBreaching would clear the alarm; ignore holds the last real state,
  # so the alarm stays raised until someone drains the queue and the metric reports zero again.
  EmailsToSendDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref DeadLetterQueueAlarmTopic
      # The alarm is effectively one-shot: nothing consumes these queues, so once it transitions to
      # ALARM it stays there until a human drains the DLQ and SQS publishes a zero. A second, larger
      # incident while it is already raised notifies nobody. OKActions make the clear visible, so
      # draining the queue is an observable act rather than silent housekeeping.
      OKActions:
        - !Ref DeadLetterQueueAlarmTopic
      AlarmDescription: An email failed every send attempt and is now stuck in the dead-letter queue
      AlarmName: !Sub
        - '${Name}-dlq-not-empty'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueNameSend]
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmailsToSendDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300
      Statistic: Maximum
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
      Threshold: 0
      TreatMissingData: ignore

  EmailsToBounceDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref DeadLetterQueueAlarmTopic
      # The alarm is effectively one-shot: nothing consumes these queues, so once it transitions to
      # ALARM it stays there until a human drains the DLQ and SQS publishes a zero. A second, larger
      # incident while it is already raised notifies nobody. OKActions make the clear visible, so
      # draining the queue is an observable act rather than silent housekeeping.
      OKActions:
        - !Ref DeadLetterQueueAlarmTopic
      AlarmDescription: A bounce failed every send attempt and is now stuck in the dead-letter queue
      AlarmName: !Sub
        - '${Name}-dlq-not-empty'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueNameBounce]
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmailsToBounceDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300
      Statistic: Maximum
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
      Threshold: 0
      TreatMissingData: ignore
