AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Email SQS queue and lambda

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      bucket: emails-service-storage
      domain: dbowland.com
      logStreamFunction: log-subscriber
      project: emails-queue-service
      queueName: emails-to-send
    test:
      bucket: emails-service-storage-test
      domain: bowland.link
      logStreamFunction: log-subscriber-test
      project: emails-queue-service-test
      queueName: emails-to-send-test

Resources:
  EmailsToSendQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days
      QueueName: !Sub
        - '${Name}.fifo'
        - Name: !FindInMap [EnvironmentMap, !Ref Environment, queueName]
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment
      VisibilityTimeout: 60

  EmailsToSendProcessor:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      Description: Processes queued messages to send emails.
      Environment:
        Variables:
          DOMAIN: !FindInMap [EnvironmentMap, !Ref Environment, domain]
          EMAIL_BUCKET: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
          EMAIL_REGION: us-east-1
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            BatchSize: 7
            Queue: !GetAtt EmailsToSendQueue.Arn
      Handler: src/handlers/emails-to-send-processor.emailsToSendProcessorHandler
      MemorySize: 128
      Policies:
        # Give Lambda basic execution Permission
        - AWSLambdaBasicExecutionRole
        # Grant access to S3 bucket
        - S3CrudPolicy:
            BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucket]
        # Grant access to SES identity
        - SESCrudPolicy:
            IdentityName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        # Grant access to SQS queue
        - SQSPollerPolicy:
            QueueName: !GetAtt EmailsToSendQueue.QueueName
      Runtime: nodejs22.x
      Tags:
        'created-by': 'emails-queue-service'
        'created-for': 'emails'
        'environment': !Ref Environment
      Timeout: 60
      Tracing: Active
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/emails-to-send-processor.ts

  EmailsToSendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EmailsToSendProcessor}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'emails-queue-service'
        - Key: 'created-for'
          Value: 'emails'
        - Key: 'environment'
          Value: !Ref Environment

  EmailsToSendLogGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref EmailsToSendLogGroup
